naftiko: 1.0.0-alpha2
info:
  label: TechRepublic WordPress REST API — Authors
  description: 'TechRepublic WordPress REST API — Authors. 2 operations. Lead operation: List Authors. Self-contained Naftiko
    capability covering one Techrepublic business surface.'
  tags:
  - Techrepublic
  - Authors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHREPUBLIC_API_KEY: TECHREPUBLIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-authors
    baseUri: https://www.techrepublic.com/wp-json/wp/v2
    description: TechRepublic WordPress REST API — Authors business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listauthors
        method: GET
        description: List Authors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page of the collection.
        - name: per_page
          in: query
          type: integer
          description: Maximum number of items to be returned in result set.
        - name: search
          in: query
          type: string
          description: Limit results to those matching a string.
    - name: users-id
      path: /users/{id}
      operations:
      - name: getauthor
        method: GET
        description: Get Author
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Unique identifier for the author.
          required: true
  exposes:
  - type: rest
    namespace: wordpress-rest-authors-rest
    port: 8080
    description: REST adapter for TechRepublic WordPress REST API — Authors. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listauthors
        description: List Authors
        call: wordpress-rest-authors.listauthors
        with:
          page: rest.page
          per_page: rest.per_page
          search: rest.search
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{id}
      name: users-id
      description: REST surface for users-id.
      operations:
      - method: GET
        name: getauthor
        description: Get Author
        call: wordpress-rest-authors.getauthor
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-authors-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechRepublic WordPress REST API — Authors. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-authors
      description: List Authors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-authors.listauthors
      with:
        page: tools.page
        per_page: tools.per_page
        search: tools.search
      outputParameters:
      - type: object
        mapping: $.
    - name: get-author
      description: Get Author
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-authors.getauthor
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
