naftiko: 1.0.0-alpha2
info:
  label: TechRepublic WordPress REST API — Tags
  description: 'TechRepublic WordPress REST API — Tags. 2 operations. Lead operation: List Tags. Self-contained Naftiko capability
    covering one Techrepublic business surface.'
  tags:
  - Techrepublic
  - Tags
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHREPUBLIC_API_KEY: TECHREPUBLIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-tags
    baseUri: https://www.techrepublic.com/wp-json/wp/v2
    description: TechRepublic WordPress REST API — Tags business capability. Self-contained, no shared references.
    resources:
    - name: tags
      path: /tags
      operations:
      - name: listtags
        method: GET
        description: List Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page of the collection.
        - name: per_page
          in: query
          type: integer
          description: Maximum number of items to be returned in result set.
        - name: search
          in: query
          type: string
          description: Limit results to those matching a string.
        - name: hide_empty
          in: query
          type: boolean
          description: Whether to hide terms not assigned to any posts.
    - name: tags-id
      path: /tags/{id}
      operations:
      - name: gettag
        method: GET
        description: Get Tag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Unique identifier for the tag.
          required: true
  exposes:
  - type: rest
    namespace: wordpress-rest-tags-rest
    port: 8080
    description: REST adapter for TechRepublic WordPress REST API — Tags. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/tags
      name: tags
      description: REST surface for tags.
      operations:
      - method: GET
        name: listtags
        description: List Tags
        call: wordpress-rest-tags.listtags
        with:
          page: rest.page
          per_page: rest.per_page
          search: rest.search
          hide_empty: rest.hide_empty
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/tags/{id}
      name: tags-id
      description: REST surface for tags-id.
      operations:
      - method: GET
        name: gettag
        description: Get Tag
        call: wordpress-rest-tags.gettag
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-tags-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechRepublic WordPress REST API — Tags. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-tags
      description: List Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-tags.listtags
      with:
        page: tools.page
        per_page: tools.per_page
        search: tools.search
        hide_empty: tools.hide_empty
      outputParameters:
      - type: object
        mapping: $.
    - name: get-tag
      description: Get Tag
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-tags.gettag
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
