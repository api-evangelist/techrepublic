naftiko: "1.0.0-alpha1"

info:
  label: "TechRepublic WordPress REST API"
  description: "WordPress REST API exposing TechRepublic posts, pages, categories, tags, authors, and media content."
  tags:
    - TechRepublic
    - WordPress
    - Content
    - Media
    - Publishing
  created: "2026-05-03"
  modified: "2026-05-03"

capability:
  consumes:
    - type: http
      namespace: techrepublic-wp
      baseUri: https://www.techrepublic.com/wp-json/wp/v2
      description: "TechRepublic WordPress REST API v2 - content access endpoints."
      resources:
        - name: posts
          path: /posts
          description: "TechRepublic articles and news posts."
          operations:
            - name: list-posts
              method: GET
              description: "Retrieve a collection of published posts."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Current page of the collection."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return (max 100)."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Limit results to those matching a string."
                - name: after
                  in: query
                  type: string
                  required: false
                  description: "Limit to posts published after a given ISO 8601 date."
                - name: before
                  in: query
                  type: string
                  required: false
                  description: "Limit to posts published before a given ISO 8601 date."
                - name: categories
                  in: query
                  type: array
                  required: false
                  description: "Limit to posts in specified category IDs."
                - name: tags
                  in: query
                  type: array
                  required: false
                  description: "Limit to posts with specified tag IDs."
                - name: orderby
                  in: query
                  type: string
                  required: false
                  description: "Sort collection by attribute."
                - name: order
                  in: query
                  type: string
                  required: false
                  description: "Order sort ascending or descending."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-post
              method: GET
              description: "Retrieve a specific post by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Unique identifier for the post."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: categories
          path: /categories
          description: "TechRepublic content categories and topic areas."
          operations:
            - name: list-categories
              method: GET
              description: "Retrieve a collection of categories."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Current page of the collection."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Limit results to those matching a string."
                - name: hide_empty
                  in: query
                  type: boolean
                  required: false
                  description: "Whether to hide terms not assigned to any posts."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-category
              method: GET
              description: "Retrieve a specific category by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Unique identifier for the category."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tags
          path: /tags
          description: "TechRepublic content tags."
          operations:
            - name: list-tags
              method: GET
              description: "Retrieve a collection of tags."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Current page of the collection."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Limit results to those matching a string."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-tag
              method: GET
              description: "Retrieve a specific tag by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Unique identifier for the tag."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: authors
          path: /users
          description: "TechRepublic authors and contributors."
          operations:
            - name: list-authors
              method: GET
              description: "Retrieve a collection of authors."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Current page of the collection."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Limit results to those matching a string."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-author
              method: GET
              description: "Retrieve a specific author by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Unique identifier for the author."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: media
          path: /media
          description: "TechRepublic media attachments and images."
          operations:
            - name: list-media
              method: GET
              description: "Retrieve a collection of media items."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Current page of the collection."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Limit results to those matching a string."
                - name: media_type
                  in: query
                  type: string
                  required: false
                  description: "Limit to attachments of a particular media type."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-media
              method: GET
              description: "Retrieve a specific media item by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Unique identifier for the media item."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: pages
          path: /pages
          description: "TechRepublic static pages."
          operations:
            - name: list-pages
              method: GET
              description: "Retrieve a collection of pages."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Current page of the collection."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Maximum number of items to return."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Limit results to those matching a string."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: get-page
              method: GET
              description: "Retrieve a specific page by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Unique identifier for the page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: techrepublic-wp-rest
      resources:
        - path: /v1/posts
          name: posts
          description: "TechRepublic articles and news posts."
          operations:
            - method: GET
              name: list-posts
              description: "List TechRepublic posts with filtering and pagination."
              call: "techrepublic-wp.list-posts"
              with:
                page: "rest.page"
                per_page: "rest.per_page"
                search: "rest.search"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/posts/{id}
          name: post
          description: "A specific TechRepublic post."
          operations:
            - method: GET
              name: get-post
              description: "Get a specific TechRepublic post by ID."
              call: "techrepublic-wp.get-post"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/categories
          name: categories
          description: "TechRepublic content categories."
          operations:
            - method: GET
              name: list-categories
              description: "List TechRepublic content categories."
              call: "techrepublic-wp.list-categories"
              with:
                page: "rest.page"
                per_page: "rest.per_page"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/tags
          name: tags
          description: "TechRepublic content tags."
          operations:
            - method: GET
              name: list-tags
              description: "List TechRepublic content tags."
              call: "techrepublic-wp.list-tags"
              with:
                page: "rest.page"
                per_page: "rest.per_page"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/authors
          name: authors
          description: "TechRepublic authors."
          operations:
            - method: GET
              name: list-authors
              description: "List TechRepublic authors."
              call: "techrepublic-wp.list-authors"
              outputParameters:
                - type: array
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: techrepublic-wp-mcp
      transport: http
      tools:
        - name: list-posts
          description: "List TechRepublic articles with optional search and filtering."
          hints:
            readOnly: true
            openWorld: true
          call: "techrepublic-wp.list-posts"
          with:
            search: "tools.search"
            categories: "tools.categories"
            tags: "tools.tags"
            per_page: "tools.per_page"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-post
          description: "Get a specific TechRepublic article by ID."
          hints:
            readOnly: true
          call: "techrepublic-wp.get-post"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-categories
          description: "List TechRepublic content categories."
          hints:
            readOnly: true
          call: "techrepublic-wp.list-categories"
          outputParameters:
            - type: array
              mapping: "$."
        - name: list-tags
          description: "List TechRepublic content tags."
          hints:
            readOnly: true
          call: "techrepublic-wp.list-tags"
          outputParameters:
            - type: array
              mapping: "$."
        - name: list-authors
          description: "List TechRepublic authors and contributors."
          hints:
            readOnly: true
          call: "techrepublic-wp.list-authors"
          outputParameters:
            - type: array
              mapping: "$."
