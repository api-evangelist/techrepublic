naftiko: 1.0.0-alpha2
info:
  label: TechRepublic WordPress REST API — Media
  description: 'TechRepublic WordPress REST API — Media. 2 operations. Lead operation: List Media. Self-contained Naftiko
    capability covering one Techrepublic business surface.'
  tags:
  - Techrepublic
  - Media
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHREPUBLIC_API_KEY: TECHREPUBLIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-media
    baseUri: https://www.techrepublic.com/wp-json/wp/v2
    description: TechRepublic WordPress REST API — Media business capability. Self-contained, no shared references.
    resources:
    - name: media
      path: /media
      operations:
      - name: listmedia
        method: GET
        description: List Media
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
          description: Current page of the collection.
        - name: per_page
          in: query
          type: integer
          description: Maximum number of items to be returned in result set.
        - name: search
          in: query
          type: string
          description: Limit results to those matching a string.
        - name: media_type
          in: query
          type: string
          description: Limit result set to attachments of a particular media type.
        - name: mime_type
          in: query
          type: string
          description: Limit result set to attachments of a particular MIME type.
    - name: media-id
      path: /media/{id}
      operations:
      - name: getmedia
        method: GET
        description: Get Media
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: integer
          description: Unique identifier for the media item.
          required: true
  exposes:
  - type: rest
    namespace: wordpress-rest-media-rest
    port: 8080
    description: REST adapter for TechRepublic WordPress REST API — Media. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/media
      name: media
      description: REST surface for media.
      operations:
      - method: GET
        name: listmedia
        description: List Media
        call: wordpress-rest-media.listmedia
        with:
          page: rest.page
          per_page: rest.per_page
          search: rest.search
          media_type: rest.media_type
          mime_type: rest.mime_type
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/media/{id}
      name: media-id
      description: REST surface for media-id.
      operations:
      - method: GET
        name: getmedia
        description: Get Media
        call: wordpress-rest-media.getmedia
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-media-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechRepublic WordPress REST API — Media. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-media
      description: List Media
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-media.listmedia
      with:
        page: tools.page
        per_page: tools.per_page
        search: tools.search
        media_type: tools.media_type
        mime_type: tools.mime_type
      outputParameters:
      - type: object
        mapping: $.
    - name: get-media
      description: Get Media
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-media.getmedia
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
