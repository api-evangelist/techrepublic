  - type: RSSFeed
    url: https://www.techrepublic.com/rssfeeds/
- aid: techrepublic:techrepublic-com-website-wordpress-rest
  name: TechRepublic Website (WordPress REST)
  description: >-
    The public WordPress REST API (wp-json) of the TechRepublic website at www.techrepublic.com: the route
    index of the site's content management system, catalogued as one site surface rather than as separate
    APIs.
  baseURL: https://www.techrepublic.com/wp-json
