apis:
- aid: techrepublic:rss-feed
  name: TechRepublic RSS Feed
  description: >-
    TechRepublic provides RSS/Atom feeds covering its full range of technology news and analysis. Feeds
    are available for the main news stream and for over 150 individual topic categories including AI,
    security, cloud, software, hardware, developer, data centers, mobility, and more. Standard RSS 2.0
    and Atom feeds allow readers and developers to consume TechRepublic content programmatically using
    any standard feed reader or parsing library. Topics span technology sectors, company coverage, geographic
    regions, and emerging technology areas.
